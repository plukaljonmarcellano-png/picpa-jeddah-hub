<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICPA-WR Chapter Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@600&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style id="app-style">
:root{
  --navy:#001D6A; --green:#31A608; --green-ink:#025B14; --green-soft:#E6F4DE;
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#F8FAFC; --line:#D9DFE7; --line-2:#E8ECF1;
  --ink:#16202E; --muted:#5B6778; --head:#001D6A; --head-ink:#FFFFFF;
  --amber:#9A4B05; --amber-soft:#FEF1DC; --red:#B42318; --red-soft:#FDE6E3;
  --blue-soft:#E4ECF6; --blue-ink:#0B3D73; --gray-soft:#EDF0F4;
  --focus:#083FE5; --viewer:#E2E7ED; --blue:#083FE5;--shadow:0 1px 2px rgba(16,32,52,.06),0 2px 8px rgba(16,32,52,.05);
  --sans:'IBM Plex Sans',Arial,sans-serif; --mono:'IBM Plex Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --navy:#8FB4E3; --green:#7ACB58; --green-ink:#A6DE8C; --green-soft:#1D3318;
    --bg:#0D141D; --surface:#131D2A; --surface-2:#172334; --line:#2A3A4F; --line-2:#223044;
    --ink:#E4EAF2; --muted:#9AA9BC; --head:#0A2744; --head-ink:#E9F0F8;
    --amber:#F2B866; --amber-soft:#3A2A12; --red:#F29B91; --red-soft:#3D1D1A;
    --blue-soft:#1A2D45; --blue-ink:#B9D1EE; --gray-soft:#1E2A39; --focus:#6F93F5; --viewer:#0A0F16; --blue:#6F93F5;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --navy:#8FB4E3; --green:#7ACB58; --green-ink:#A6DE8C; --green-soft:#1D3318;
  --bg:#0D141D; --surface:#131D2A; --surface-2:#172334; --line:#2A3A4F; --line-2:#223044;
  --ink:#E4EAF2; --muted:#9AA9BC; --head:#0A2744; --head-ink:#E9F0F8;
  --amber:#F2B866; --amber-soft:#3A2A12; --red:#F29B91; --red-soft:#3D1D1A;
  --blue-soft:#1A2D45; --blue-ink:#B9D1EE; --gray-soft:#1E2A39; --focus:#6F93F5; --viewer:#0A0F16; --blue:#6F93F5;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* top bar */
.bar{background:var(--head);color:var(--head-ink);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;position:sticky;top:0;z-index:5;box-shadow:0 1px 0 rgba(0,0,0,.2)}
.bar-in{max-width:1280px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand b{font-size:17px;letter-spacing:.2px}
.brand span{font-size:11.5px;opacity:.85;letter-spacing:.3px}
.brand i{font-style:normal;color:var(--green)}
.savebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.state{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
.state.dirty{background:#FDE8B8;color:#5C3300}
.tabs{max-width:1280px;margin:10px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;color:var(--head-ink);opacity:.72;padding:9px 14px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--green)}
.tabs button:hover{opacity:1}
.tabs .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}

.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.banner{border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--amber-soft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.banner.info{background:var(--blue-soft);color:var(--blue-ink);border-color:transparent}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--green);border-color:var(--green);color:#0E2206;font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:4px 8px}
.btn.ghost:hover{color:var(--ink);background:var(--gray-soft)}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.bar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:var(--head-ink)}
.bar .btn.primary{background:var(--green);color:#0E2206;border-color:var(--green)}
.bar a.btn{text-decoration:none;font:inherit;font-size:12.5px;font-weight:500}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.f{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;min-width:0;width:100%}
.f:hover{border-color:var(--line)}
.f:focus{border-color:var(--focus);background:var(--surface);outline:none}
select.f{cursor:pointer;padding-right:2px}
.f.boxed{border-color:var(--line);background:var(--surface)}
.f.title{font-weight:600}
.f.unset{color:var(--amber);font-style:italic}
textarea.f{resize:vertical;min-height:64px;border-color:var(--line);background:var(--surface)}
label.lab{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;min-width:0}
label.lab .f{font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;border-color:var(--line);background:var(--surface)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.c-green{background:var(--green-soft);color:var(--green-ink)}
.c-blue{background:var(--blue-soft);color:var(--blue-ink)}
.c-amber{background:var(--amber-soft);color:var(--amber)}
.c-red{background:var(--red-soft);color:var(--red)}
.c-gray{background:var(--gray-soft);color:var(--muted)}
.idtag{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--navy);background:var(--blue-soft);padding:2px 7px;border-radius:5px;white-space:nowrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.ph h2{font-size:16px;margin:0;color:var(--navy)}
.ph .sp{flex:1}
.pb{padding:14px 16px}
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:6px 0 0;display:flex;align-items:center;gap:8px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line-2)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-family:var(--mono);color:var(--navy)}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn b{color:var(--red)}

/* meetings */
.mlayout{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}
.mlist{display:flex;flex-direction:column;overflow:hidden}
.mitem{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:11px 14px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;cursor:pointer;width:100%}
.mitem:hover{background:var(--surface-2)}
.mitem[aria-current="true"]{background:var(--blue-soft);box-shadow:inset 3px 0 0 var(--navy)}
.mitem .t{font-weight:600}
.mitem .d{grid-column:2;font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.prog{height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px}
.progline{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.progline .prog{flex:1}

.ag{border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column}
.ag + .ag{margin-top:8px}
.ag.done{background:var(--surface-2)}
.ag.done .ag-title{text-decoration:line-through;color:var(--muted)}
.ag.carried{opacity:.7}
.ag-top{display:grid;grid-template-columns:34px auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 12px 4px}
.tick{appearance:none;width:24px;height:24px;border:2px solid var(--navy);border-radius:6px;cursor:pointer;display:grid;place-items:center;margin:0;background:var(--surface)}
.tick:checked{background:var(--green);border-color:var(--green)}
.tick:checked::after{content:"";width:6px;height:11px;border:solid #0E2206;border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.tick:disabled{opacity:.5;cursor:default}
.ag-tools{display:flex;gap:2px;align-items:center}
.ag-sub{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 10px;padding:2px 12px 8px 56px}
.ag-sub label.lab .f{border-color:transparent;background:transparent}
.ag-sub label.lab .f:hover{border-color:var(--line)}
.ag-out{padding:0 12px 8px 56px}
.ag-out .f{border-color:var(--line-2);background:var(--surface-2)}
.from{font-size:12px;color:var(--amber);padding:0 12px 4px 56px}
.tasks{padding:0 12px 10px 56px;display:flex;flex-direction:column;gap:4px}
.trow{display:grid;grid-template-columns:auto 118px minmax(160px,1fr) minmax(190px,1.1fr) 140px auto auto;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:3px 6px}
.trow.closed .f.title{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.agps{padding:0 12px 12px 56px;display:flex;flex-direction:column;gap:8px}
.agp{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;background:var(--surface)}
.agp.gen{border-left-color:var(--line)}
.agp-h{display:grid;grid-template-columns:auto minmax(0,1fr) 130px 190px auto auto;gap:6px;align-items:center;padding:6px 8px}
.agp.gen .agp-h{display:flex}
.agp-lbl{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:3px 2px}
.agp .tasks{padding:0 8px 8px}
.addproj{width:auto;max-width:100%;color:var(--navy);font-weight:600}
.closebox{border:1px dashed var(--navy);border-radius:10px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--blue-soft)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}

/* projects */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .f{width:auto;border-color:var(--line);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.pcards{display:flex;flex-direction:column;gap:8px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pc-top{display:grid;grid-template-columns:86px minmax(0,1fr) 150px;gap:8px 10px;align-items:center;padding:10px 12px 4px}
.pc-id{font-family:var(--mono);font-weight:600;color:var(--navy);background:var(--blue-soft);border-color:transparent;text-align:center}
.pc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 10px;padding:0 12px 6px}
.pc-foot{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:6px 12px 10px;font-size:12.5px;color:var(--muted)}
.pc-foot .prog{width:120px}
.pc-more{border-top:1px solid var(--line-2);padding:12px;display:flex;flex-direction:column;gap:10px}
.pc-more .tasks{padding:0}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:120px}
.col h4{margin:0;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line-2)}
.col .cards{padding:8px;display:flex;flex-direction:column;gap:8px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.bcard .n{font-weight:600}
.bcard .s{font-size:12px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.hist a{color:var(--navy);cursor:pointer;text-decoration:underline}

/* calendar */
.yr{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.yr button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.yr button b{font-family:var(--mono);font-size:13px;color:var(--navy)}
.yr button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 -3px 0 var(--green)}
.calhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calhead h2{margin:0;font-size:20px;color:var(--navy);min-width:170px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;overflow:hidden}
.grid7 .dow{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:6px 8px;background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.day{min-height:96px;padding:4px 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:3px;min-width:0}
.day.out{background:var(--surface-2)}
.day .dn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.day.today .dn{background:var(--navy);color:#fff;border-radius:99px;width:22px;text-align:center}
.ev{font-size:11.5px;line-height:1.3;padding:2px 5px;border-radius:4px;border:0;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.ev.m{background:var(--navy);color:#fff}
.ev.a{background:var(--green-soft);color:var(--green-ink)}
.ev.t{background:var(--amber-soft);color:var(--amber)}
.ev.v{background:var(--blue-soft);color:var(--blue-ink);border:1px solid var(--navy)}
button.ev:hover{filter:brightness(1.12);text-decoration:underline}
.flash,.flash td{animation:flash 2.4s ease-out}
@keyframes flash{0%,45%{background:var(--amber-soft);box-shadow:0 0 0 2px var(--amber)}100%{background:transparent;box-shadow:none}}
.undated{border:1px solid var(--amber);background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.undated b{color:var(--amber)}
.undated-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev.l{background:var(--surface-2);color:var(--muted);border:1px dashed var(--muted)}
.ev.l.now{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
.lrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,150px) minmax(0,150px) minmax(0,1.5fr) 36px auto;gap:6px;align-items:center;border-bottom:1px solid var(--line-2);padding:4px 0}
.lrow.h{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
.lclash{grid-column:1/-1;font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:6px;padding:4px 8px}
.ev b{font-family:var(--mono);font-weight:600;font-size:10.5px;opacity:.8}
.tbd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;border:1px dashed var(--green);border-radius:10px;background:var(--surface)}
.tbd .ev{width:auto;max-width:100%}
.tbd-l{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--green-ink);font-weight:600;margin-right:4px}
.seg{display:inline-flex}
.seg .btn{border-radius:0}
.seg .btn:first-child{border-radius:8px 0 0 8px}
.seg .btn:last-child{border-radius:0 8px 8px 0;margin-left:-1px}
.seg .btn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.ycal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.ymo{border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;flex-direction:column;min-width:0}
.ymo.now{border-color:var(--navy);box-shadow:inset 0 3px 0 var(--green)}
.ymo-h{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:10px 10px 0 0;cursor:pointer;font:600 13.5px/1.2 var(--sans);color:var(--navy);text-align:left}
.ymo-h b{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.ymo-h:hover{background:var(--blue-soft)}
.ymo-b{padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-height:48px}
.ymo-r{display:flex;gap:6px;align-items:center;min-width:0}
.ymo-d{font-family:var(--mono);font-size:11px;color:var(--muted);width:26px;flex:none;text-align:right}
.ymo-r .ev{flex:1;min-width:0}
.visit-row a{color:var(--navy);cursor:pointer;text-decoration:underline;font-family:var(--mono);font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.arow{display:grid;grid-template-columns:120px minmax(160px,1fr) 170px 150px 140px 130px 150px auto;gap:6px;align-items:center;border-bottom:1px solid var(--line-2);padding:4px 0}
.arow.h{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.scroll > .inner{min-width:1080px}

/* tables */
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0}
table.t td{padding:3px 4px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.t tr:hover td{background:var(--surface-2)}
.tbl{min-width:1000px}

.help{font-size:13px;color:var(--muted);line-height:1.55;max-width:75ch}
.help b{color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

@media (max-width:900px){
  .mlayout{grid-template-columns:1fr}
  .mlist{max-height:260px;overflow:auto}
  .two{grid-template-columns:1fr}
  .yr{grid-auto-flow:row;grid-template-columns:repeat(6,minmax(0,1fr))}
}
/* split: editor left, document right */
.wrap.split{max-width:1640px}
.split-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.editor{container:ed/inline-size;display:flex;flex-direction:column;gap:14px;min-width:0}
.preview{position:sticky;top:calc(var(--barh,110px) + 12px);max-height:calc(100vh - var(--barh,110px) - 24px);overflow:auto;background:var(--viewer);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column}
.ptools{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--viewer);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}

@container ed (max-width:560px){
  .ag-top{grid-template-columns:30px minmax(0,1fr) auto}
  .ag-top .idtag{grid-column:2;grid-row:2;justify-self:start}
  .agp-h{grid-template-columns:auto minmax(0,1fr) auto}
  .agp-h select{grid-column:1/-1}
  .trow{grid-template-columns:auto 1fr auto}
  .pc-top{grid-template-columns:70px minmax(0,1fr)}
  .pc-top select{grid-column:1/-1}
  .day{min-height:58px}
  .day .ev{font-size:0;height:7px;padding:0}
  .grid7 .dow{padding:4px;font-size:10px}
  .yr{grid-auto-flow:row;grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:640px){
  /* activity rows become stacked cards */
  .scroll > .inner{min-width:0}
  .arow.h{display:none}
  .arow{grid-template-columns:1fr 1fr;gap:6px;padding:10px 0}
  .arow > :nth-child(2){grid-column:1/-1;order:-1}
  .arow > :nth-child(1){order:-2;grid-column:1/-1}
  .lrow.h{display:none}
  .lrow{grid-template-columns:1fr 1fr;padding:10px 0}
  .lrow > :nth-child(1),.lrow > :nth-child(4){grid-column:1/-1}
  /* tasks + people tables become stacked cards */
  table.t.tbl,table.t.ppl{min-width:0!important}
  table.t.tbl thead,table.t.ppl thead{display:none}
  table.t.tbl tr,table.t.ppl tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
  table.t.tbl td,table.t.ppl td{display:block;border:0;padding:0;min-width:0}
  table.t.tbl tr:hover td,table.t.ppl tr:hover td{background:none}
  table.t.tbl td[colspan]{grid-column:1/-1}
  table.t.tbl td:nth-child(1),table.t.ppl td:nth-child(1){order:-3}
  table.t.tbl td:nth-child(9),table.t.ppl td:nth-child(8){order:-2;justify-self:end}
  table.t.tbl td:nth-child(2),table.t.tbl td:nth-child(5),table.t.ppl td:nth-child(2),table.t.ppl td:nth-child(3){grid-column:1/-1}
  table.t.tbl td:nth-child(3)::before{content:"Project"}
  table.t.tbl td:nth-child(4)::before{content:"Agenda"}
  table.t.tbl td:nth-child(5)::before{content:"Assigned to"}
  table.t.tbl td:nth-child(6)::before{content:"Due"}
  table.t.tbl td:nth-child(7)::before{content:"Status"}
  table.t.tbl td:nth-child(8)::before{content:"Alert"}
  table.t.ppl td:nth-child(4)::before{content:"Status"}
  table.t.ppl td:nth-child(5)::before{content:"Projects led"}
  table.t.ppl td:nth-child(6)::before{content:"Open tasks"}
  table.t.ppl td:nth-child(7){grid-column:1/-1}
  table.t.ppl td:nth-child(7)::before{content:"Vacation"}
  table.t.tbl td::before,table.t.ppl td::before{display:block;font:600 10.5px/1.4 var(--sans);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:2px}
  .tbd .ev{white-space:normal}
}
@media print{
  @page{size:A4;margin:14mm}
  *,*::before,*::after{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  body{background:#fff}
  .bar,.editor,.ptools,.banner,.panes,.docbar{display:none!important}
  .wrap,.wrap.split{padding:0;max-width:none}
  .split-grid{display:block}
  .preview{display:block!important;position:static;max-height:none;overflow:visible;border:0;background:#fff}
  .paperwrap{padding:0}
  .paper{box-shadow:none;max-width:none;min-height:0;padding:0}
  .paper tr,.di{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function projSortKey(p){
  if(isHubProject(p))return "";
  if(/recognition/i.test(p.name||""))return "~";
  var k="9999";projActs(p.id).forEach(function(a){var x=a.date||(a.month?a.month+"-32":"");if(x&&x<k)k=x;});return k;}
function thirdThursday(ym){var p=ym.split("-"),d=new Date(+p[0],+p[1]-1,1);return ym+"-"+pad(1+(4-d.getDay()+7)%7+14);}
function sortByProposed(list){return list.map(function(p,i){return {p:p,i:i,k:projSortKey(p)};}).sort(function(a,b){return a.k<b.k?-1:a.k>b.k?1:a.i-b.i;}).map(function(x){return x.p;});}
function pname(id){var p=person(id);return p?p.name:"";}
function proj(id){for(var i=0;i<S.projects.length;i++)if(S.projects[i].id===id)return S.projects[i];return null;}
function meeting(id){for(var i=0;i<S.meetings.length;i++)if(S.meetings[i].id===id)return S.meetings[i];return null;}
function agendaItem(id){var mid=String(id).split("-")[0];var m=meeting(mid);if(!m)return null;for(var i=0;i<m.agenda.length;i++)if(m.agenda[i].id===id)return m.agenda[i];return null;}
function task(id){for(var i=0;i<S.tasks.length;i++)if(S.tasks[i].id===id)return S.tasks[i];return null;}
function act(id){for(var i=0;i<S.activities.length;i++)if(S.activities[i].id===id)return S.activities[i];return null;}
function isOpenTask(t){return t.status!=="Done"&&t.status!=="Cancelled";}
function taskAlert(t){
  if(!isOpenTask(t))return ["Closed","gray"];
  var td=todayISO();
  if(t.due&&t.due<td)return ["Overdue","red"];
  if(!t.owner)return ["Needs owner","amber"];
  if(!t.due)return ["No due date","gray"];
  var d=(new Date(t.due)-new Date(td))/864e5;
  if(d<=7)return ["Due soon","amber"];
  return ["On track","green"];
}
function sortMeetings(){return S.meetings.slice().sort(function(a,b){if(!a.date&&!b.date)return a.id<b.id?-1:1;if(!a.date)return 1;if(!b.date)return -1;return a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1);});}

/* ---------- options ---------- */
function opt(v,label,sel){return '<option value="'+h(v)+'"'+(v===sel?" selected":"")+'>'+h(label)+'</option>';}
function optsList(list,sel,blank){var s=blank!=null?opt("",blank,sel):"";list.forEach(function(x){s+=opt(x,x,sel);});if(sel&&list.indexOf(sel)<0)s+=opt(sel,sel,sel);return s;}
function peopleOpts(sel){var s=opt("","Unassigned",sel||"");namedPeople().forEach(function(p){s+=opt(p.id,p.name,sel);});return s;}
function projOpts(sel,blank){var s=opt("",blank||"No project",sel||"");S.projects.forEach(function(p){s+=opt(p.id,p.id+" · "+p.name,sel);});return s;}
function chip(text,col){return '<span class="chip c-'+col+'">'+h(text)+'</span>';}
function fld(e,id,f,val,extra){return '<input class="f'+(extra&&extra.cls?" "+extra.cls:"")+'" data-e="'+e+'" data-id="'+h(id)+'" data-f="'+f+'" value="'+h(val)+'"'+(extra&&extra.ph?' placeholder="'+h(extra.ph)+'"':"")+(extra&&extra.type?' type="'+extra.type+'"':"")+(extra&&extra.aria?' aria-label="'+h(extra.aria)+'"':"")+'>';}
function sel(e,id,f,optionsHtml,extra){return '<select class="f'+(extra&&extra.cls?" "+extra.cls:"")+'" data-e="'+e+'" data-id="'+h(id)+'" data-f="'+f+'"'+(extra&&extra.r?' data-r="1"':"")+(extra&&extra.aria?' aria-label="'+h(extra.aria)+'"':"")+'>'+optionsHtml+'</select>';}
function delBtn(key,label){var on=U.confirm===key;return '<button class="btn '+(on?"sm danger":"ghost sm")+'" data-a="del" data-k="'+h(key)+'" title="Delete">'+(on?"Confirm delete":(label||"✕"))+'</button>';}

/* ---------- persistence ---------- */
function markDirty(){
  S.updatedAt=new Date().toISOString();
  dirty=true;
  if(MODE==="local"){ls(function(){localStorage.setItem(LS_KEY,JSON.stringify(S));});}
  else if(MODE==="artifact"){ls(function(){sessionStorage.setItem(SS_DRAFT,JSON.stringify({base:EMBED.updatedAt,state:S}));});}
  else if(MODE==="cloud"){clearTimeout(CSAVE);CSAVE=setTimeout(cloudSave,1200);}
  renderBar();
}
function saveUI(){ls(function(){sessionStorage.setItem(SS_UI,JSON.stringify({tab:U.tab,meeting:U.meeting,calMonth:U.calMonth,calView:U.calView,pView:U.pView}));});}
function buildDoc(state){
  var json=JSON.stringify(state).replace(/</g,"\\u003c");

function hubLink(t){var c=window.TRACKER_CLOUD||{};return '<a class="btn primary" href="'+h(c.hub||"./")+'">'+h(t)+'</a>';}
/* ---------- Hub calendar link (Programs & Events = public.announcements) ---------- */
var HUBCAT={cpd_program:"CPD program",seminar_training:"Seminar / Training",general_meeting:"General meeting",social_event:"Social event",announcement:"Announcement",news:"News",project:"Project"};
function hubObj(kind,id){return kind==="mtg"?meeting(id):act(id);}
function riyadh(iso){var d=new Date(new Date(iso).getTime()+3*3600000).toISOString();return {date:d.slice(0,10),time:d.slice(11,16)};}
function hubDefaultCat(kind,o){
  if(kind==="mtg")return "general_meeting";
  var c=(o.category||"")+" "+(o.title||"");
  if(/knowledge|kapehan|seminar|training|professional|lecture|forum|\bai\b/i.test(c))return "seminar_training";
  if(/fellowship|sport|bowling|pickle|legends|social|student|quiz|olympics|gathering|party/i.test(c))return "social_event";
  var p=o.projectId&&proj(o.projectId);if(p&&p.kind!=="Event")return "project";
  return "announcement";}
function hubWhen(kind,o){var d=o.date;if(!d)return null;var t=kind==="mtg"?(o.callTime||o.time||""):(o.time||"");return {date:d,time:t,iso:d+"T"+(t||"00:00")+":00+03:00"};}
function hubCtl(kind,o,compact){
  if(MODE!=="cloud")return "";
  var ref=kind+":"+o.id,on=!!(o.hub&&o.hub.on),cat=(o.hub&&o.hub.cat)||hubDefaultCat(kind,o);
  var st='<span class="hubst" id="hubst-'+h(ref.replace(":","-"))+'">'+hubStText(ref,o,kind)+'</span>';
  var sw='<label class="hubsw" title="Show this on the Hub\'s Programs & Events for members"><input type="checkbox" data-hub="'+kind+'|'+h(o.id)+'"'+(on?" checked":"")+'> '+(compact?'Hub':'Post on the Hub (Programs &amp; Events)')+'</label>';
  var cs=on?'<select class="f hubcat" data-hubcat="'+kind+'|'+h(o.id)+'" aria-label="Hub category">'+Object.keys(HUBCAT).map(function(k){return opt(k,HUBCAT[k],cat);}).join("")+'</select>':'';
  var tm=on&&kind==="act"?'<label class="hubtime">Start time'+fld("act",o.id,"time",o.time||"",{type:"time",aria:"Start time for the Hub post"})+'</label>':'';
  return '<div class="hubctl'+(compact?" sm":"")+'">'+sw+cs+tm+st+'</div>';}
function hubStText(ref,o,kind){
  var s=HUBST[ref],on=!!(o.hub&&o.hub.on);
  if(s==="busy")return "Updating the Hub…";
  if(s&&s.indexOf("err:")===0)return '<span class="bad">Hub: '+h(s.slice(4))+'</span>';
  if(on&&!o.date)return '<span class="bad">Set an exact date to post</span>';
  if(on)return HUBLINK[ref]&&HUBLINK[ref].is_published?'<span class="good">On the Hub</span>':'Will post shortly';
  return compact0(kind)?'':'<span class="muted">Only officers see it</span>';}
function compact0(kind){return kind==="act";}
function hubMark(o){return o&&o.hub&&o.hub.on?'<i class="hubdot" title="Posted on the Hub"></i>':'';}
function hubLoad(){
  if(MODE!=="cloud"||!SB)return Promise.resolve();
  return SB.from("announcements").select("id,title,category,event_date,venue,is_published,tracker_ref").not("event_date","is",null).then(function(r){
    if(r.error||!r.data)return;
    var ev=[],link={};
    r.data.forEach(function(x){var w=riyadh(x.event_date),row={id:x.id,title:x.title,category:x.category,date:w.date,time:w.time,venue:x.venue||"",is_published:x.is_published};
      if(x.tracker_ref)link[x.tracker_ref]=row;else if(x.is_published)ev.push(row);});
    ev.sort(function(a,b){return a.date<b.date?-1:1;});
    var changed=JSON.stringify([ev,link])!==JSON.stringify([HUBEV,HUBLINK]);
    HUBEV=ev;HUBLINK=link;
    if(changed)hubRender();
  });}
function hubRender(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="checkbox"){HUBDEFER=true;return;}HUBDEFER=false;render();}
function hubQueue(kind,id,ms){var ref=kind+":"+id;clearTimeout(HUBQ[ref]);HUBQ[ref]=setTimeout(function(){hubPush(kind,id);},ms==null?1500:ms);}
function hubStPaint(ref,kind){var el=document.getElementById("hubst-"+ref.replace(":","-")),o=hubObj(kind,ref.split(":")[1]);if(el&&o)el.innerHTML=hubStText(ref,o,kind);}
function hubPush(kind,id){
  var o=hubObj(kind,id),ref=kind+":"+id;if(!SB||MODE!=="cloud")return;
  var linked=HUBLINK[ref],on=!!(o&&o.hub&&o.hub.on);
  function fin(r){if(r&&r.error)HUBST[ref]="err:"+(r.error.message||"could not save");else delete HUBST[ref];hubLoad().then(function(){hubStPaint(ref,kind);});hubStPaint(ref,kind);}
  function upd(rid,patch){HUBST[ref]="busy";hubStPaint(ref,kind);return SB.from("announcements").update(patch).eq("id",rid).select("id").then(fin,function(){fin({error:{message:"network error"}});});}
  if(!o||!on){if(linked&&linked.is_published)upd(linked.id,{is_published:false});return;}
  var w=hubWhen(kind,o);
  if(!w){if(linked&&linked.is_published)upd(linked.id,{is_published:false});else hubStPaint(ref,kind);return;}
  var row={title:o.title||"Untitled",category:o.hub.cat||hubDefaultCat(kind,o),venue:(kind==="mtg"?o.venue:"")||null,is_published:true,tracker_ref:ref,event_date:w.iso};
  // keep a time an officer set on the Hub when the tracker has only a date
  if(linked&&!w.time&&linked.date===w.date)delete row.event_date;
  if(!row.venue)delete row.venue;
  if(linked)return upd(linked.id,row);
  // an existing Hub post on the same day for the same thing is adopted, not duplicated
  function words(t){return String(t||"").toLowerCase().split(/[^a-z0-9]+/).filter(function(x){return x.length>3&&!/^(picpa|chapter|jeddah|with|from|during|launch|meeting)$/.test(x);});}
  var mine=words(o.title),cand=HUBEV.filter(function(e){return e.date===w.date&&(e.category===row.category||words(e.title).some(function(x){return mine.indexOf(x)>=0;}));})[0];
  if(cand)return upd(cand.id,row);
  HUBST[ref]="busy";hubStPaint(ref,kind);
  SB.from("announcements").insert(row).select("id").then(fin,function(){fin({error:{message:"network error"}});});
}
function cloudBoot(){
  var C=window.TRACKER_CLOUD;MODE="cloud";
  gate('<p>Signing you in…</p>');
  if(!window.supabase||!window.supabase.createClient){gate('<p>The sign-in library could not load. Check your connection, then reload this page.</p>');return;}
  SB=window.supabase.createClient(C.url,C.key);
  SB.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT")gate('<p>You have been signed out.</p>'+hubLink("Sign in on the Hub"));});
  SB.auth.getSession().then(function(r){
    var ses=r&&r.data&&r.data.session;
    if(!ses){gate('<p>Sign in to the Jeddah Chapter Hub first, then open the tracker again.</p>'+hubLink("Go to the Hub sign-in"));return;}
    CUSER=ses.user.email||"";
    SB.from("profiles").select("is_admin").eq("id",ses.user.id).maybeSingle().then(function(p){
      if(p.error){gate('<p>Could not check your access: '+h(p.error.message)+'</p>');return;}
      if(!p.data||!p.data.is_admin){gate('<p>The chapter tracker is for Hub admins only. You are signed in as <b>'+h(CUSER)+'</b>.</p>'+hubLink("Back to the Hub"));return;}
      cloudLoad(true);ledgerRole();
    });
  },function(){gate('<p>Sign-in check failed. Reload the page to try again.</p>');});
  setInterval(cloudPoll,30000);
  window.addEventListener("focus",cloudPoll);
  window.addEventListener("beforeunload",function(e){if(MODE==="cloud"&&(dirty||busy)){e.preventDefault();e.returnValue="";}});
}
// Ledger link: shown only when the database says this user has a Ledger role (RPC may not exist yet; any failure = no link)
var LEDGER_LINK='<a id="barledger" class="btn sm" href="./ledger.html" aria-label="Open the Ledger">Ledger</a>';
function ledgerRole(){
  try{Promise.resolve(SB.rpc("ledger_my_role")).then(function(r){
    if(!r||r.error||typeof r.data!=="string"||!r.data)return;
    LROLE=r.data;   // later bar() renders include the link
    // The bar may already be on screen: add the link in place (never a full render(), which would wipe a focused
    // input or text being typed), just before #barstate inside .savebox, once.
    var st=document.getElementById("barstate");
    if(st&&!document.getElementById("barledger"))st.insertAdjacentHTML("beforebegin",LEDGER_LINK);
  }).catch(function(){});}catch(e){}
}
function cloudLoad(first,note){
  return SB.from("tracker_state").select("data,version,updated_at,updated_by").eq("id","main").maybeSingle().then(function(r){
    if(r.error){if(first)gate('<p>Could not load the tracker: '+h(r.error.message)+'</p>');else{banner={kind:"warn",text:"Could not refresh from the Hub: "+r.error.message};render();}return;}
    hubLoad();
    if(!r.data){CV=0;if(first){banner={kind:"info",text:"The tracker has no data yet. Go to Settings & data → Import data (JSON) to load your tracker file."};U.tab="data";}render();return;}
    CV=r.data.version;CINFO={by:r.data.updated_by,at:r.data.updated_at};hubLoad();
    PATCHED=false;S=r.data.data;normalize();dirty=false;
    if(note)banner={kind:"info",text:note};
    render();
    if(PATCHED)markDirty();
  });
}
function cloudSave(){
  if(MODE!=="cloud"||!SB)return;
  if(busy){CPEND=true;return;}
  busy=true;CINFO.err="";renderBar();
  var snap=JSON.parse(JSON.stringify(S)),q;
  if(CV===0)q=SB.from("tracker_state").insert({id:"main",data:snap}).select("version,updated_at,updated_by");
  else q=SB.from("tracker_state").update({data:snap}).eq("id","main").eq("version",CV).select("version,updated_at,updated_by");
  q.then(function(r){
    busy=false;
    var row=r.data&&r.data[0];
    if((r.error&&r.error.code==="23505")||(!r.error&&!row)){cloudConflict(snap);return;}
    if(r.error){CINFO.err=r.error.message||"network error";renderBar();clearTimeout(CSAVE);CSAVE=setTimeout(cloudSave,10000);return;}
    CV=row.version;CINFO={by:row.updated_by,at:row.updated_at};
    if(CPEND||S.updatedAt!==snap.updatedAt){CPEND=false;cloudSave();return;}
    dirty=false;renderBar();
  },function(){busy=false;CINFO.err="network error";renderBar();clearTimeout(CSAVE);CSAVE=setTimeout(cloudSave,10000);});
}
function cloudConflict(mine){
  cloudLoad(false).then(function(){
    banner={kind:"warn",text:(CINFO.by||"Another admin")+" saved changes at "+(CINFO.at?new Date(CINFO.at).toLocaleTimeString():"the same time")+" while you were editing. You're now seeing their version. Restoring yours will replace theirs.",restore:mine};
    render();
  });
}
function cloudPoll(){
  if(MODE==="cloud"&&SB){if(HUBDEFER)hubRender();hubLoad();}
  if(MODE!=="cloud"||!SB||busy||dirty)return;
  SB.from("tracker_state").select("version,updated_by").eq("id","main").maybeSingle().then(function(r){
    if(r.data&&r.data.version>CV&&!busy&&!dirty)cloudLoad(false,"Updated with the latest changes from "+(r.data.updated_by||"another admin")+".");
  });
}
function saveShared(){
  if(!ART||busy)return;
  busy=true;renderBar();
  S.updatedAt=new Date().toISOString();
  ls(function(){sessionStorage.setItem(SS_DRAFT,JSON.stringify({base:EMBED.updatedAt,state:S}));});
  saveUI();
  ART.publish(buildDoc(S)).then(function(){dirty=false;busy=false;renderBar();},function(err){
    busy=false;var c=err&&err.code;
    if(c==="conflict"){banner={kind:"warn",text:"Someone else saved first. The page is reloading with their version; you can restore your changes after it loads."};}
    else if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"||c==="capability_removed"){MODE="readonly";banner={kind:"info",text:"You can view this tracker but not save it. Ask the owner for edit access."};}
    else if(c==="rate_limited"){banner={kind:"warn",text:"Saving too often. Wait a moment, then save again."};}
    else if(c==="too_large"){banner={kind:"warn",text:"The tracker is too large to save. Remove old meetings or export them first."};}
    else{banner={kind:"warn",text:"Saving failed. Your changes are still here; try Save again."};}
    render();
  });
}
function exportFile(name,text,type){
  if(DL){DL.save({filename:name,data:new Blob([text],{type:type})}).catch(function(){});return;}
  if(MODE!=="local"&&MODE!=="cloud"){banner={kind:"info",text:"Downloads aren't available in this view."};render();return;}
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function downloadHTML(){exportFile("PICPA-WR Chapter Tracker.html",buildDoc(S),"text/html");if(MODE==="local"){dirty=false;renderBar();}}

/* ---------- top bar ---------- */
function renderBar(){
  var el=document.getElementById("barstate");if(!el)return;
  var st,cls="state";
  if(MODE==="artifact"){st=busy?"Saving…":dirty?"Unsaved changes":"All changes saved";if(dirty)cls+=" dirty";}
  else if(MODE==="readonly"){st="View only";}
  else if(MODE==="cloud"){st=CINFO.err?"Not saved · retrying ("+CINFO.err+")":busy?"Saving…":dirty?"Saving soon…":"Saved to the Hub";if(dirty||CINFO.err)cls+=" dirty";}
  else{st=dirty?"Saved in this browser · download to update the file":"Up to date";if(dirty)cls+=" dirty";}
  el.className=cls;el.textContent=st;
  var b=document.getElementById("barsave");
  if(b){b.hidden=!(MODE==="artifact"&&dirty)||busy;}
  var d=document.getElementById("bardl");
  if(d){d.hidden=MODE!=="local";}
}

  '<div class="savebox">'+(LROLE?LEDGER_LINK:'')+'<span id="barstate" class="state"></span><button id="barsave" class="btn primary sm" data-a="save" hidden>Save for everyone</button><button id="bardl" class="btn sm" data-a="dlhtml" hidden>Download updated file</button></div></div>'+

/* ---------- stats ---------- */
function stats(){
  var open=S.tasks.filter(isOpenTask);var td=todayISO();
  var overdue=open.filter(function(t){return t.due&&t.due<td;}).length;
  var active=S.projects.filter(function(p){return ["Approved","In progress","Delayed"].indexOf(p.status)>=0;}).length;
  var nextM=sortMeetings().filter(function(m){return m.status!=="Closed";})[0];
  var unfinished=0;S.meetings.forEach(function(m){if(m.status!=="Closed")m.agenda.forEach(function(a){if(a.carriedFrom&&!a.done)unfinished++;});});
  return '<div class="stats">'+
   '<div class="stat"><b>'+S.projects.filter(function(p){return p.status==="Proposed";}).length+' / '+active+'</b><span>Projects proposed / active</span></div>'+
   '<div class="stat"><b>'+open.length+'</b><span>Open tasks</span></div>'+
   '<div class="stat'+(overdue?" warn":"")+'"><b>'+overdue+'</b><span>Overdue tasks</span></div>'+
   '<div class="stat"><b>'+unfinished+'</b><span>Unfinished business items</span></div>'+
   '<div class="stat"><b style="font-size:15px;font-family:var(--sans)">'+(nextM?h(nextM.id+" · "+(nextM.date?fmtDate(nextM.date):"Date TBD")):"None")+'</b><span>'+(nextM?h(nextM.title):"Next meeting")+'</span></div></div>';
}

/* ---------- meetings ---------- */
function vMeetings(){
  var list=sortMeetings();
  if(!meeting(U.meeting)&&list.length)U.meeting=list[0].id;
  var m=meeting(U.meeting);
  var pick='<div class="panel"><div class="ph"><label for="mpick" class="muted" style="font-weight:600">Meeting</label><select class="f boxed" id="mpick" style="flex:1;min-width:200px;width:auto">'+
   list.map(function(x){var d=x.agenda.filter(function(a){return a.done;}).length;return opt(x.id,x.id+" · "+(x.title||"Untitled meeting")+" — "+(x.date?fmtDate(x.date):"Date TBD")+" · "+x.status+" · "+d+"/"+x.agenda.length+" done",U.meeting);}).join("")+

function meetingDetail(m){
  var closed=m.status==="Closed";
  var items=m.agenda, total=items.length, done=items.filter(function(a){return a.done;}).length;
  var mins=items.reduce(function(s,a){return s+(+a.mins||0);},0);
  var ub=items.filter(function(a){return a.carriedFrom;}), reg=items.filter(function(a){return !a.carriedFrom;});
  var head='<div class="ph"><span class="idtag">'+m.id+'</span><h2>'+h(m.title||"Untitled meeting")+'</h2>'+chip(m.status,MCOL[m.status]||"gray")+'<span class="sp"></span>'+delBtn("meeting:"+m.id,"Delete meeting")+'</div>';
  var decidedIn=[];S.meetings.forEach(function(x){x.agenda.forEach(function(a){if(a.schedFor===m.id)decidedIn.push(a.id);});});
  var meta='<div class="when"><div class="when-h"><b>When &amp; where</b><span class="muted">'+(decidedIn.length?"Being decided in "+decidedIn.join(", ")+". You can also edit it here.":(m.date&&m.venue?"Shown on the notice, the minutes and the calendar":"Fill these in once decided. They appear on the notice, the minutes and the calendar."))+'</span></div>'+
   '<div class="when-g">'+
   '<label class="lab">Date'+fld("meeting",m.id,"date",m.date,{type:"date",cls:m.date?"":"need"})+'</label>'+
   '<label class="lab">Start time'+fld("meeting",m.id,"time",m.time,{type:"time",cls:m.time?"":"need"})+'</label>'+
   '<label class="lab venue">Venue'+fld("meeting",m.id,"venue",m.venue,{ph:"Type the venue, e.g. hotel or hall name, city",cls:m.venue?"":"need",aria:"Venue"})+'</label></div>'+hubCtl("mtg",m)+'</div>'+
   '<div class="meta">'+
   '<label class="lab">Title'+fld("meeting",m.id,"title",m.title,{})+'</label>'+
   '<label class="lab">Type'+sel("meeting",m.id,"type",optsList(S.lists.meetingTypes,m.type))+'</label>'+
   '<label class="lab">Status'+sel("meeting",m.id,"status",optsList(MEET_ST,m.status),{r:1})+'</label></div>';
  var prog='<div class="progline"><span class="mono">'+done+' of '+total+' done</span><div class="prog"><i style="width:'+(total?Math.round(done/total*100):0)+'%"></i></div><span>'+mins+' min'+(m.time?" · ends ≈ "+endTime(m.time,mins):"")+'</span></div>';
  var approved=m.agendaStatus==="Approved";
  var body='';
  if(ub.length)body+='<h3 class="sec">Unfinished business</h3>'+ub.map(function(a){return agendaCard(m,a,closed);}).join("");
  body+='<h3 class="sec">'+(approved?"Approved agenda":"Proposed agenda · draft")+'</h3>'+(reg.length?reg.map(function(a){return agendaCard(m,a,closed);}).join(""):'<div class="empty">No agenda items yet. Add the items you will present for approval.</div>');
  if(!closed)body+='<div class="addrow"><button class="btn" data-a="add-agenda" data-v="'+m.id+'">'+(approved?"+ Item added during the meeting":"+ Agenda item")+'</button></div>';
  var notes='<div class="ag-out lists" style="padding:0">'+listEditor(m,"others","Other matters","Matter not on the agenda, then press Enter for the next",closed)+listEditor(m,"annc","Announcements","Type an announcement, then press Enter for the next",closed)+'</div>';
  meta+=attendeesSection(m)+minutesDetails(m);
  prog+=approvalBar(m);
  var close;
  if(closed){close='<div class="closebox"><b>Meeting closed.</b><span>'+items.filter(function(a){return a.carried;}).length+' item(s) were carried to later meetings.</span><span class="sp" style="flex:1"></span><button class="btn sm" data-a="reopen" data-v="'+m.id+'">Reopen (undo close)</button></div>';}
  else if(U.closing===m.id){
    var open=items.filter(function(a){return !a.done;});
    var targets=sortMeetings().filter(function(x){return x.id!==m.id&&x.status!=="Closed";});
    var same=targets.filter(function(x){return x.type===m.type;})[0], dflt=same?same.id:"__new";
    close='<div class="closebox"><b>Close '+m.id+'</b><span>'+(open.length?open.length+' unfinished item(s) move to the Unfinished business of:':'All items are done.')+'</span>'+
     (open.length?'<select class="f boxed" id="carryto" style="width:auto">'+targets.map(function(x){return opt(x.id,x.id+" · "+x.title+(x.date?" ("+fmtDate(x.date)+")":""),dflt);}).join("")+opt("__new","+ New "+(m.type||"meeting").toLowerCase(),dflt)+'</select>':'')+
     '<button class="btn primary sm" data-a="close-confirm" data-v="'+m.id+'">Close meeting</button><button class="btn sm" data-a="close-cancel">Cancel</button></div>';
  } else {

     '<div class="addrow"><button class="btn" data-a="close-start" data-v="'+m.id+'">Close meeting and carry unfinished items…</button></div>';
  }
  return '<div class="panel">'+head+'<div class="pb" style="display:flex;flex-direction:column;gap:14px">'+meta+prog+body+notes+close+'</div></div>';
}
function orderedItems(m){return m.agenda.filter(function(a){return a.carriedFrom;}).concat(m.agenda.filter(function(a){return !a.carriedFrom;}));}
function nextOpenId(m){var o=orderedItems(m).filter(function(a){return !a.done&&!a.carried;})[0];return o?o.id:"";}
function minutesDetails(m){
  return '<details class="mdet" data-det="mdet"'+(U.mdet?" open":"")+'><summary>Minutes details<span class="muted">presiding officer, minute-taker, times, sections to include</span></summary>'+
   '<div class="incl"><b>Include in the minutes:</b>'+[["showCall","Call to order"],["showQuorum","Determination of quorum"],["showAgendaApproval","Approval of the agenda"],["showNoted","“Noted by” signature"],["showApproved","“Minutes approved on” line"],["showDecDetails","Details column in project decisions"]].map(function(x){return '<label><input type="checkbox" data-e="meeting" data-id="'+m.id+'" data-f="'+x[0]+'" data-r="1"'+(m[x[0]]!==false?" checked":"")+'> '+x[1]+'</label>';}).join("")+'</div>'+
   '<div class="meta" style="margin-top:10px">'+
   '<label class="lab">Presiding officer'+sel("meeting",m.id,"presiding",peopleOpts(m.presiding))+'</label>'+
   '<label class="lab">Minutes taken by'+sel("meeting",m.id,"secretary",peopleOpts(m.secretary),{r:1})+'</label>'+
   '<label class="lab">Called to order'+fld("meeting",m.id,"callTime",m.callTime,{type:"time"})+'</label>'+
   '<label class="lab">Adjourned'+fld("meeting",m.id,"adjournTime",m.adjournTime,{type:"time"})+'</label>'+
   '<label class="lab">Quorum'+sel("meeting",m.id,"quorum",optsList(["Declared","Not declared"],m.quorum,"Not recorded"))+'</label></div>'+
   '<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">'+
   '<label class="lab">Previous minutes'+fld("meeting",m.id,"prevMinutes",m.prevMinutes,{ph:"e.g. The minutes of M01 were approved as presented. Leave blank if none."})+'</label>'+
   '<label class="lab">Guests / also present'+fld("meeting",m.id,"guests",m.guests,{ph:"Names of guests, if any"})+'</label>'+
   '</div></details>';
}
function attCounts(m){
  var att=m.attendance||{},c={Present:0,Absent:0,Excused:0,none:0};
  namedPeople().forEach(function(p){c[att[p.id]||"none"]++;});
  m.attendees.forEach(function(x){c[x.status||"none"]++;});
  return c;
}
function attendeesSection(m){
  var att=m.attendance||{},c=attCounts(m);
  var roster=namedPeople().map(function(p){return '<label class="attrow"><span>'+h(p.name||"Unnamed")+'<small>'+(p.sn?'SN '+h(p.sn)+' · ':'')+h(p.role)+(p.status==="Tentative"?' · tentative':'')+'</small></span><select class="f boxed att-'+(att[p.id]||"none")+'" data-att="'+m.id+'" data-p="'+p.id+'" aria-label="Attendance of '+h(p.name)+'">'+optsList(["Present","Absent","Excused"],att[p.id]||"","—")+'</select></label>';}).join("");
  var extra=m.attendees.map(function(x){var key=m.id+":"+x.id;return '<div class="xrow"><span class="idtag">'+x.id+'</span>'+
    fld("attendee",key,"name",x.name,{cls:"title",ph:"Full name",aria:"Attendee name"})+
    fld("attendee",key,"role",x.role,{ph:"Position / organization",aria:"Attendee role"})+
    sel("attendee",key,"kind",optsList(["Member","Guest","Officer"],x.kind),{aria:"Attendee type",r:1})+
    sel("attendee",key,"status",optsList(["Present","Absent","Excused"],x.status,"—"),{cls:"boxed att-"+(x.status||"none"),r:1,aria:"Attendance"})+
    '<button class="btn ghost sm" data-a="att-promote" data-v="'+h(key)+'" title="Add this person to the People list so they can be assigned tasks">+ People list</button>'+delBtn("attendee:"+key)+'</div>';}).join("");
  return '<div class="attsec"><div class="attsec-h"><b>Attendees</b><span class="muted">'+
    '<span class="chip c-green">'+c.Present+' present</span> <span class="chip c-red">'+c.Absent+' absent</span> <span class="chip c-amber">'+c.Excused+' excused</span>'+(c.none?' <span class="chip c-gray">'+c.none+' not marked</span>':'')+'</span><span style="flex:1"></span>'+
    '<button class="btn sm" data-a="att-all" data-v="'+m.id+'">Mark all present</button></div>'+
    '<h3 class="sec">Officers &amp; people list</h3><div class="attgrid">'+roster+'</div>'+
    '<h3 class="sec">Members &amp; guests at this meeting</h3>'+(extra||'<div class="muted" style="font-size:13px">Add members or guests who attend but are not on the People list.</div>')+
    '<div class="addrow"><button class="btn sm" data-a="add-attendee" data-v="'+m.id+'">+ Add attendee</button></div></div>';
}
function approvalBar(m){
  if(m.status==="Closed")return "";
  if(m.agendaStatus!=="Approved"){
    if(U.approving===m.id)return '<div class="apprbox form"><b>Approval of the agenda</b><div class="meta">'+
      '<label class="lab">Moved by'+sel("meeting",m.id,"agendaMovedBy",peopleOpts(m.agendaMovedBy))+'</label>'+
      '<label class="lab">Seconded by'+sel("meeting",m.id,"agendaSecondedBy",peopleOpts(m.agendaSecondedBy))+'</label></div>'+
      '<label class="lab">Amendments, if any'+fld("meeting",m.id,"agendaNote",m.agendaNote,{ph:"Leave blank if approved as presented"})+'</label>'+
      '<div class="addrow"><button class="btn primary" data-a="approve" data-v="'+m.id+'">Approve agenda and start the meeting</button><button class="btn" data-a="approve-cancel">Cancel</button></div></div>';
    return '<div class="apprbox draft"><div><b>Proposed agenda · draft</b><br><span>Add, order and assign the items below. At the meeting, present the agenda for approval before discussion starts.</span></div><button class="btn primary" data-a="approve-start" data-v="'+m.id+'">Present agenda for approval…</button></div>';
  }
  var cur=agendaItem(m.current);
  return '<div class="apprbox ok"><div><b>Agenda approved</b>'+(m.agendaMovedBy?' · moved by '+h(pname(m.agendaMovedBy)):'')+(m.agendaSecondedBy?', seconded by '+h(pname(m.agendaSecondedBy)):'')+
   (m.agendaNote?'<br><span>Amendments: '+h(m.agendaNote)+'</span>':'')+
   (cur?'<br>Now discussing: <span class="idtag">'+cur.id+'</span> <b>'+h(cur.title||"Untitled item")+'</b>':'<br><span>All agenda items have been taken up. Close the meeting when ready.</span>')+'</div>'+
   '<span class="addrow">'+(cur?'<button class="btn primary sm" data-a="next-item" data-v="'+m.id+'">Mark done · next item ▸</button>':'')+'<button class="btn sm" data-a="unapprove" data-v="'+m.id+'">Back to draft</button></span></div>';
}
function endTime(t,mins){var p=t.split(":");var d=new Date(2000,0,1,+p[0],+p[1]+mins);var hh=d.getHours(),mm=d.getMinutes();return (hh%12||12)+":"+pad(mm)+(hh<12?" AM":" PM");}
function schedBox(m,a,lock){
  var others=sortMeetings().filter(function(x){return x.id!==m.id;});
  var t=a.schedFor?meeting(a.schedFor):null;
  if(!t){
    if(lock||!others.length)return "";
    return '<div class="ag-sched-add"><select class="f boxed addproj" data-sched="'+a.id+'" aria-label="Set the schedule of another meeting from this item"><option value="">+ Decide the date or venue of another meeting in this item…</option>'+
      others.map(function(x){return opt(x.id+"|date",x.id+" · "+(x.title||"Untitled meeting")+" — date & time","")+opt(x.id+"|venue",x.id+" · "+(x.title||"Untitled meeting")+" — venue","");}).join("")+'</select></div>';
  }
  var gmm=t.type==="General Membership Meeting",nm=gmm?"GMM":t.id;
  var tools='<span style="flex:1"></span>'+(lock?"":'<button class="btn ghost sm" data-a="sched-off" data-v="'+a.id+'">Unlink</button>');
  var out='';
  if(a.schedPart!=="venue"){
    out+='<div class="ag-sched"><div class="ag-sched-h"><b>'+nm+' date &amp; time</b><span class="muted">'+h(t.id)+' · '+h(t.title||"")+'</span>'+tools+'</div>'+
     '<div class="when-g dt">'+
     '<label class="lab">'+nm+' date'+fld("meeting",t.id,"date",t.date,{type:"date",cls:t.date?"":"need"})+'</label>'+
     '<label class="lab">Start time'+fld("meeting",t.id,"time",t.time,{type:"time",cls:t.time?"":"need"})+'</label>'+
     '<div class="lab">Reads as<span class="dt-read">'+(t.date?h(longDate(t.date)):'<span class="muted">date not set</span>')+(t.time?' · '+h(endTime(t.time,0)):'')+'</span></div></div></div>';
  }
  if(a.schedPart!=="date"){
    var vo=t.venueOptions||[];
    var visitTask=S.tasks.filter(function(x){return x.visitFor===t.id;})[0];
    out+='<div class="ag-sched venue"><div class="ag-sched-h"><b>'+nm+' venue</b><span class="muted">'+vo.length+' option'+(vo.length===1?"":"s")+' · '+(t.venue?'chosen: <b>'+h(t.venue)+'</b>':'not yet chosen')+'</span>'+tools+'</div>'+
     '<div class="visit"><b>Site visit</b>'+
     '<label class="lab">Date'+fld("meeting",t.id,"siteVisitDate",t.siteVisitDate,{type:"date",cls:t.siteVisitDate?"":"need"})+'</label>'+
     '<label class="lab">Time'+fld("meeting",t.id,"siteVisitTime",t.siteVisitTime,{type:"time"})+'</label>'+
     '<div class="lab vteam">Visiting team<div class="vteam-list">'+(t.siteVisitTeamIds||[]).map(function(pid,i){return '<span class="chip c-blue">'+h(pname(pid)||pid)+(i===0?' · lead':'')+(lock?'':' <button class="x" data-a="vteam-rm" data-v="'+h(t.id+":"+pid)+'" aria-label="Remove '+h(pname(pid))+'">✕</button>')+'</span>';}).join("")+
       (lock?'':'<select class="f boxed" data-vteam="'+h(t.id)+'" aria-label="Add to the visiting team"><option value="">+ Add person</option>'+namedPeople().filter(function(p){return (t.siteVisitTeamIds||[]).indexOf(p.id)<0;}).map(function(p){return opt(p.id,p.name,"");}).join("")+'</select>')+'</div></div>'+
     '<label class="lab">Others / guests'+fld("meeting",t.id,"siteVisitTeam",t.siteVisitTeam,{ph:"Names not on the People list"})+'</label>'+
     (visitTask?'<span class="muted" style="font-size:12px">Tracked as task <span class="idtag">'+visitTask.id+'</span> '+chip(visitTask.status,TCOL[visitTask.status]||"gray")+'</span>':'')+'</div>'+
     '<div class="vopts">'+vo.map(function(o,i){var key=t.id+":"+o.id,chosen=t.venueChosen===o.id;
       return '<div class="vopt'+(chosen?" chosen":"")+'"><div class="vopt-h"><span class="idtag">Option '+(i+1)+'</span>'+(chosen?chip("Chosen venue","green"):"")+'<span style="flex:1"></span>'+(lock?"":delBtn("vopt:"+key))+'</div>'+
        '<label class="lab">Venue name'+fld("vopt",key,"name",o.name,{cls:"title",ph:"e.g. hotel or hall name"})+'</label>'+
        '<label class="lab">Location / address'+fld("vopt",key,"location",o.location,{ph:"District, city"})+'</label>'+
        '<div class="vopt-2"><label class="lab">Capacity'+fld("vopt",key,"capacity",o.capacity,{type:"number",ph:"pax"})+'</label>'+
        '<label class="lab">Est. cost ('+h(S.settings.currency)+')'+fld("vopt",key,"cost",o.cost,{type:"number",ph:"Estimate"})+'</label></div>'+
        '<label class="lab">Site visit'+sel("vopt",key,"visit",optsList(["To visit","Visited","Not needed"],o.visit),{r:1,cls:"boxed"})+'</label>'+
        '<label class="lab">Findings / notes'+'<textarea class="f" data-e="vopt" data-id="'+h(key)+'" data-f="notes" rows="2" placeholder="Parking, AV, food, access, availability on the date">'+h(o.notes)+'</textarea></label>'+
        (lock?"":'<div class="addrow">'+(chosen?'<button class="btn sm" data-a="venue-unchoose" data-v="'+h(t.id)+'">Undo choice</button>':'<button class="btn primary sm" data-a="venue-choose" data-v="'+h(key)+'">Choose this venue</button>')+'</div>')+'</div>';}).join("")+
     (lock?"":'<button class="vopt add" data-a="vopt-add" data-v="'+h(t.id)+'">+ Add venue option</button>')+'</div>'+
     '<label class="lab">Final venue (as it will appear on the GMM notice)'+fld("meeting",t.id,"venue",t.venue,{ph:"Filled in when you choose an option, or type it",cls:t.venue?"":"need"})+'</label></div>';
  }
  return out;
}
function schedSentence(t,part){
  if(part==="date")return 'The '+h(t.title||"meeting")+' will be held on '+(t.date?'<b>'+h(longDate(t.date))+'</b>':'<span class="tbd">date to be decided</span>')+(t.time?', at <b>'+h(endTime(t.time,0))+'</b>':'')+'.';
  if(part==="venue")return 'The venue of the '+h(t.title||"meeting")+(t.venue?' will be <b>'+h(t.venue)+'</b>.':' is <span class="tbd">still to be decided</span>.');
  return 'The '+h(t.title||"meeting")+' will be held on '+(t.date?'<b>'+h(longDate(t.date))+'</b>':'<span class="tbd">date to be decided</span>')+(t.time?', at <b>'+h(endTime(t.time,0))+'</b>':'')+', '+(t.venue?'at <b>'+h(t.venue)+'</b>':'<span class="tbd">venue to be decided</span>')+'.';
}
function venueMinutes(t){
  var vo=(t.venueOptions||[]).filter(function(o){return o.name||o.location||o.notes;});
  var s='';
  if(t.siteVisitDate)s+='<p class="small">Site visit '+(vo.some(function(o){return o.visit==="Visited";})?'conducted':'scheduled')+' on '+h(longDate(t.siteVisitDate))+(t.siteVisitTime?' at '+h(endTime(t.siteVisitTime,0)):'')+(visitTeamText(t)?' by '+h(visitTeamText(t)):'')+'.</p>';
  if(vo.length)s+='<p class="small"><b>Venue options considered:</b></p><table><thead><tr><th style="width:22%">Venue</th><th style="width:18%">Location</th><th style="width:9%">Capacity</th><th style="width:12%">Est. cost</th><th style="width:11%">Site visit</th><th>Findings</th></tr></thead><tbody>'+
    vo.map(function(o){var ch=t.venueChosen===o.id;return '<tr><td>'+(ch?'<b>':'')+(o.name?h(o.name):'<span class="tbd">Unnamed</span>')+(ch?' ✓</b><br><span class="muted">Selected</span>':'')+'</td><td>'+h(o.location)+'</td><td>'+(o.capacity?h(o.capacity):'')+'</td><td>'+(o.cost?h(S.settings.currency+" "+(+o.cost).toLocaleString()):'')+'</td><td>'+h(o.visit)+'</td><td>'+h(o.notes)+'</td></tr>';}).join("")+'</tbody></table>';
  return s;
}
function discEditor(a,lock){
  var d=a.disc||[];var rows=d.length?d:(lock?[]:[{p:"",r:[]}]);
  return '<div class="dlist"><div class="lst-h">Discussion points &amp; resolutions'+(d.length?' <span class="mono muted">'+d.length+'</span>':'')+'<span class="dhint">Enter: point → its resolution → next resolution · Enter on an empty resolution: new point</span></div>'+
   rows.map(function(x,i){var rr=(x.r&&x.r.length)?x.r:(lock?[]:[""]);var k=a.id+"|"+i;
     return '<div class="dblock"><div class="lst-row"><span class="bul num">'+(i+1)+'.</span><input class="f dp" data-dp="'+h(k)+'" value="'+h(x.p)+'" placeholder="Discussion point (e.g. Venue)" aria-label="Discussion point '+(i+1)+'"'+(lock?" disabled":"")+'>'+(lock?'':'<button class="btn ghost sm" data-a="dp-del" data-v="'+h(k)+'" title="Remove this point and its resolutions">✕</button>')+'</div>'+
      '<div class="dres">'+rr.map(function(v,j){return '<div class="lst-row"><span class="bul res">↳</span><input class="f" data-dr="'+h(k+"|"+j)+'" value="'+h(v)+'" placeholder="Resolution for this point" aria-label="Resolution '+(j+1)+' for point '+(i+1)+'"'+(lock?" disabled":"")+'>'+(lock?'':'<button class="btn ghost sm" data-a="dr-del" data-v="'+h(k+"|"+j)+'" title="Remove">✕</button>')+'</div>';}).join("")+
      (lock?'':'<button class="btn ghost sm lst-add" data-a="dr-add" data-v="'+h(k)+'">+ Resolution for this point</button>')+'</div></div>';}).join("")+
   (lock?'':'<button class="btn ghost sm lst-add" data-a="dp-add" data-v="'+h(a.id)+'">+ Add discussion point</button>')+'</div>';
}
function syncDisc(a){
  a.disc=a.disc||[];
  a.points=a.disc.map(function(x){return x.p;});
  a.resolutions=[];a.disc.forEach(function(x){(x.r||[]).forEach(function(r){if(r)a.resolutions.push(r);});});
  a.discussion=a.points.filter(Boolean).join("\n");a.outcome=a.resolutions.join("; ");
}
function ensureDisc(a,i){a.disc=a.disc||[];while(a.disc.length<=i)a.disc.push({p:"",r:[]});a.disc[i].r=a.disc[i].r||[];return a.disc[i];}
function dFocus(sel){setTimeout(function(){var el=app.querySelector(sel);if(el){el.focus();var n=el.value.length;el.setSelectionRange(n,n);}},0);}
function listEditor(a,key,label,ph,lock){
  var arr=a[key]||[];
  return '<div class="lst lst-'+key+'"><div class="lst-h">'+label+(arr.length?' <span class="mono muted">'+arr.length+'</span>':'')+'</div>'+
   (arr.length?arr:(lock?[]:[""])).map(function(v,i){return '<div class="lst-row"><span class="bul" aria-hidden="true">•</span><input class="f" data-li="'+h(a.id+"|"+key+"|"+i)+'" value="'+h(v)+'" placeholder="'+h(ph)+'" aria-label="'+h(label)+' '+(i+1)+'"'+(lock?" disabled":"")+'>'+(lock?'':'<button class="btn ghost sm" data-a="li-del" data-v="'+h(a.id+"|"+key+"|"+i)+'" title="Remove">✕</button>')+'</div>';}).join("")+
   (lock?'':'<button class="btn ghost sm lst-add" data-a="li-add" data-v="'+h(a.id+"|"+key)+'">+ Add '+(LI_ADD[key]||"line")+'</button>')+'</div>';
}
function liOwner(id){return String(id).indexOf("-")>=0?agendaItem(id):meeting(id);}
function syncLists(a){
  if(Array.isArray(a.points)){a.discussion=(a.points||[]).filter(Boolean).join("\n");a.outcome=(a.resolutions||[]).filter(Boolean).join("; ");}
  if(Array.isArray(a.others)){a.notes=a.others.filter(Boolean).join("\n");a.announcements=(a.annc||[]).filter(Boolean).join("; ");}
}
var LI_ADD={points:"discussion point",resolutions:"resolution",others:"other matter",annc:"announcement"};
function liFocus(id){setTimeout(function(){var el=app.querySelector('[data-li="'+id+'"]');if(el){el.focus();var n=el.value.length;el.setSelectionRange(n,n);}},0);}
function agendaCard(m,a,closed){
  var lock=closed||a.carried;
  var tks=S.tasks.filter(function(t){return t.agendaId===a.id;});
  var approved=m.agendaStatus==="Approved", now=approved&&!closed&&m.current===a.id;
  var cls="ag"+(a.done?" done":"")+(a.carried?" carried":"")+(now?" now":"");
  var idx=m.agenda.indexOf(a);
  var s='<div class="'+cls+'"><div class="ag-top">'+
   '<input type="checkbox" class="tick" data-e="agenda" data-id="'+a.id+'" data-f="done" data-r="1" aria-label="Done: '+h(a.title)+'"'+(a.done?" checked":"")+(lock?" disabled":"")+'>'+
   '<span class="idtag">'+a.id+'</span>'+
   '<input class="f title ag-title" data-e="agenda" data-id="'+a.id+'" data-f="title" value="'+h(a.title)+'" placeholder="Agenda item" aria-label="Agenda item title">'+
   '<span class="ag-tools">'+(now?chip("Now discussing","green"):"")+(a.addedLater?chip("Added at meeting","blue"):"")+(approved&&!closed&&!now&&!a.done&&!a.carried?'<button class="btn ghost sm" data-a="take-up" data-v="'+a.id+'">Take up now</button>':"")+(a.carried?chip("Carried to "+a.carriedTo,"amber"):"")+(!lock?'<button class="btn ghost sm" data-a="mv" data-v="'+a.id+'" data-d="-1" title="Move up"'+(idx===0?" disabled":"")+'>↑</button><button class="btn ghost sm" data-a="mv" data-v="'+a.id+'" data-d="1" title="Move down"'+(idx===m.agenda.length-1?" disabled":"")+'>↓</button>'+delBtn("agenda:"+a.id):"")+'</span></div>';
  if(a.carriedFrom)s+='<div class="from">Carried from '+h(a.carriedFrom)+'</div>';
  s+='<div class="ag-sub">'+
   '<label class="lab">Responsible'+sel("agenda",a.id,"owner",peopleOpts(a.owner),{cls:a.owner?"":"unset"})+'</label>'+
   '<label class="lab">Minutes'+fld("agenda",a.id,"mins",a.mins,{type:"number"})+'</label>'+
   '<label class="lab">Moved by'+sel("agenda",a.id,"motionBy",peopleOpts(a.motionBy))+'</label>'+
   '<label class="lab">Seconded by'+sel("agenda",a.id,"secondedBy",peopleOpts(a.secondedBy))+'</label></div>'+
   schedBox(m,a,lock)+
   '<div class="ag-out">'+discEditor(a,lock)+'</div>';
  var linked=a.projectIds.filter(function(pid){return proj(pid);});
  var other=tks.filter(function(t){return linked.indexOf(t.projectId)<0;});
  s+='<div class="agps">'+linked.map(function(pid){return projBlock(a,proj(pid),tks,lock);}).join("");
  if(other.length||!lock)s+='<div class="agp gen"><div class="agp-h"><span class="agp-lbl">'+(linked.length?"Other tasks for this item":"Tasks for this item")+'</span></div><div class="tasks">'+other.map(taskRow).join("")+(lock?"":'<div class="addrow"><button class="btn ghost sm" data-a="add-task" data-ag="'+a.id+'">+ Task</button></div>')+'</div></div>';
  if(!lock&&U.newProj===a.id){s+=newProjForm();}
  else if(!lock){
    var avail=S.projects.filter(function(p){return a.projectIds.indexOf(p.id)<0;});
    s+='<div class="addrow"><select class="f boxed addproj" data-link="'+a.id+'" aria-label="Add a project to this agenda item"><option value="">+ Add project to '+a.id+'…</option><option value="__new">+ New project</option>'+(avail.length>1?'<option value="__all">+ Add all remaining projects ('+avail.length+')</option>':'')+
      avail.map(function(p){return opt(p.id,p.id+" · "+(p.name||"Untitled"),"");}).join("")+'</select></div>';
  }
  return s+'</div></div>';
}
function projBlock(a,p,tks,lock){
  var mine=tks.filter(function(t){return t.projectId===p.id;});
  var d=mine.filter(function(t){return t.status==="Done";}).length;
  return '<div class="agp"><div class="agp-h"><span class="idtag">'+p.id+'</span>'+
   fld("project",p.id,"name",p.name,{cls:"title",ph:"Project name",aria:"Project name"})+
   sel("project",p.id,"status",optsList(PROJ_ST,p.status),{r:1,aria:"Project status"})+
   sel("project",p.id,"lead",peopleOpts(p.lead),{cls:p.lead?"":"unset",r:1,aria:"Project lead"})+

function catCodes(){
  var map={},used={};
  S.lists.projectCategories.forEach(function(c){
    var name=c.replace(/^\s*[A-Za-z]\s*[—–-]\s*/,"").trim();
    var words=name.split(/[\s&\/,]+/).filter(function(w){return w&&!/^(through|and|of|the|for|in|to|with)$/i.test(w);});
    var code=(words.length>1?words.map(function(w){return w[0];}).join("").slice(0,3):name.replace(/[^A-Za-z]/g,"").slice(0,2)).toUpperCase()||"PR";
    var base=code,k=2;while(used[code]){code=base+k;k++;}
    used[code]=1;map[c]=code;
  });
  return map;
}
function nextProjId(cat){
  var code=catCodes()[cat]||"PR",mx=0,re=new RegExp("^"+code+"-(\\d+)$");
  S.projects.forEach(function(p){var m=String(p.id).match(re);if(m)mx=Math.max(mx,+m[1]);});
  return code+"-"+pad(mx+1);
}

  if(U.open[id]){U.open[v]=1;delete U.open[id];}
}

function calMonths(){

  if(a.carried)s+='<p class="small"><i>Not concluded; carried forward to '+h(a.carriedTo)+' ('+h(meetingLabel(a.carriedTo))+').</i></p>';

function docMinutes(m){

  var mem=m.attendees.filter(function(x){return x.kind!=="Guest";}),gst=m.attendees.filter(function(x){return x.kind==="Guest";});
  function names(st){return ros.concat(mem).filter(function(p){return p.status===st&&p.name;});}
  var pres=names("Present"),abs=names("Absent"),exc=names("Excused");
  var gp=gst.filter(function(x){return x.status==="Present"&&x.name;});
  function card(cls,label,ps,extra){return '<div class="attc '+cls+'"><h4><span>'+label+'</span><span>'+(ps.length+(extra?1:0))+'</span></h4>'+(ps.length||extra?'<ul>'+ps.map(function(p){return '<li>'+h(p.name)+(p.role?'<small>'+h(p.role)+'</small>':'')+'</li>';}).join("")+(extra?'<li>'+h(extra)+'</li>':'')+'</ul>':'<span class="none">None</span>')+'</div>';}
  var body='<h3>Attendance</h3><div class="attg">'+card("pre","Present",pres)+card("exc","Excused",exc)+card("abs","Absent",abs)+'</div>'+
   ((gp.length||m.guests)?'<div class="attg" style="grid-template-columns:1fr">'+card("gst","Also present / guests",gp,m.guests)+'</div>':'');
  var secs=[];function sec(t,x){secs.push([t,x]);}
  var pr=m.presiding?h(pname(m.presiding))+(roleOf(m.presiding)?", "+h(roleOf(m.presiding)):""):"the President";
  if(m.showCall!==false)sec("Call to Order",'<p>The meeting was called to order at '+(m.callTime?h(endTime(m.callTime,0)):blank())+' by '+pr+', who presided.</p>');
  var tot=pres.length+abs.length+exc.length;
  if(m.showQuorum!==false)sec("Determination of Quorum",'<p>'+(tot?'The Secretary noted that '+pres.length+' of '+tot+' '+(m.type==="General Membership Meeting"?"expected attendees":"officers")+' were present'+(m.quorum==="Declared"?', and the presiding officer declared the presence of a quorum.':m.quorum==="Not declared"?'; no quorum was declared.':'.'):'<span class="tbd">Attendance not yet recorded.</span>')+'</p>');
  if(m.showAgendaApproval!==false)sec("Approval of the Agenda",'<p>'+(m.agendaStatus==="Approved"?(m.agendaMovedBy?'On motion of '+h(pname(m.agendaMovedBy))+(m.agendaSecondedBy?', duly seconded by '+h(pname(m.agendaSecondedBy)):'')+', the':'The')+' agenda was approved'+(m.agendaNote?' with the following amendment(s): '+h(m.agendaNote)+'.':' as presented.'):'<span class="tbd">The agenda has not yet been approved.</span>')+'</p>');

  if(ub.length)sec("Matters Arising / Unfinished Business",ub.map(function(a,i){return itemMinutes(a,letterOf(i));}).join(""));

  var om=(m.others||[]).filter(Boolean);if(om.length)sec("Other Matters",'<ul class="pts">'+om.map(function(x){return '<li>'+h(x)+'</li>';}).join("")+'</ul>');
  var an=(m.annc||[]).filter(Boolean);if(an.length)sec("Announcements",'<ul class="pts">'+an.map(function(x){return '<li>'+h(x)+'</li>';}).join("")+'</ul>');
  var nx=nextMeetingAfter(m);
  sec("Next Meeting",'<p>'+(nx?'The next meeting, '+h(nx.title)+', is scheduled on '+h(longDate(nx.date))+(nx.time?' at '+h(endTime(nx.time,0)):'')+(nx.venue?', '+h(nx.venue):'')+'.':'The schedule of the next meeting will be announced.')+'</p>');

  body+=signBlock(m,m.showNoted!==false)+(m.showApproved!==false?'<p class="approved">Minutes approved on: ____________________</p>':'');
  var kicker='<b>'+h(m.title||"Meeting")+'</b>'+(m.status!=="Closed"?'<span class="draft">Draft</span>':'');
  return docShell("Minutes of the Meeting",kicker,meetMeta(m,true),body,true,"Minutes · "+m.id+" · "+(m.title||""),m.status!=="Closed"?"DRAFT":"");

function docAgenda(m){
