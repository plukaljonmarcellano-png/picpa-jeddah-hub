<style id="tk-style">
/* tk.css — styles of the ticketing pages on Hub v2.2 tokens. Colours appear ONLY in the :root token block.
   Mobile first: the base rules are the phone layout; min-width queries widen it. Class prefix: tk-. */
:root {
  /* brand */
  --navy-900: #0B1540;
  --navy-800: #101E5A;
  --navy-700: #16297A;
  --navy-500: #2149D6;
  --navy-100: #E6ECFB;
  --green-700: #1E6B22;
  --green-500: #3FA62B;
  --green-400: #52A828;
  --green-100: #E8F5E3;
  /* status (each with -ink for text on -bg) */
  --info: #2149D6;  --info-ink: #17349A;  --info-bg: #E8EEFC;
  --good: #1E7A2E;  --good-ink: #155A21;  --good-bg: #E6F4E8;
  --warn: #CA8A04;  --warn-ink: #7A5203;  --warn-bg: #FEF6DC;
  --crit: #DC2626;  --crit-ink: #991B1B;  --crit-bg: #FDECEC;
  /* neutrals */
  --bg: #F4F6FA;
  --surface: #FFFFFF;
  --surface-2: #F8F9FC;
  --line: #DDE2EC;
  --line-strong: #C5CCDA;
  --text: #172033;
  --muted: #5B6478;
  --on-dark: #FFFFFF;
  --on-dark-muted: #B9C3E6;
  --focus: #2149D6;
  --scrim: rgba(11, 21, 64, 0.45);
  /* type */
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 15px; --fs-lg: 18px; --fs-xl: 22px; --fs-2xl: 28px;
  /* spacing, 4px base */
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px;
  --s6: 24px; --s7: 32px; --s8: 40px; --s9: 48px; --s10: 64px;
  /* radii */
  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-pill: 999px;
  /* elevation */
  --e1: 0 1px 2px rgba(11, 21, 64, 0.06), 0 1px 1px rgba(11, 21, 64, 0.04);
  --e2: 0 4px 12px rgba(11, 21, 64, 0.08), 0 1px 3px rgba(11, 21, 64, 0.06);
  --e3: 0 16px 40px rgba(11, 21, 64, 0.18), 0 4px 12px rgba(11, 21, 64, 0.08);
  /* motion */
  --t-fast: 120ms; --t-med: 200ms; --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  /* page width */
  --page-w: 960px;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
  font-size: var(--fs-md); line-height: 1.5; font-feature-settings: 'tnum' 1, 'cv11' 1;
}
a { color: var(--navy-500); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { color: var(--navy-800); line-height: 1.25; margin: 0 0 var(--s3); }
h1 { font-size: var(--fs-xl); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: var(--fs-md); }
p { margin: 0 0 var(--s3); }
.tk-muted { color: var(--muted); }
.tk-mini { font-size: var(--fs-xs); color: var(--muted); }
.tk-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tk-nowrap { white-space: nowrap; }
.tk-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tk-skip { position: absolute; left: -999px; top: var(--s2); }
.tk-skip:focus { left: var(--s2); z-index: 100; background: var(--surface); padding: var(--s2) var(--s3); border-radius: var(--r-sm); }

/* ---------- header */
.tk-head { background: var(--surface); border-bottom: 1px solid var(--line); }
.tk-head-in {
  max-width: var(--page-w); margin: 0 auto; padding: var(--s3) var(--s4);
  display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap;
}
.tk-brand { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
.tk-brand-mark { flex: none; width: 40px; height: 40px; }
.tk-brand-text { display: flex; flex-direction: column; line-height: 1.25; min-width: 0; }
.tk-brand-text b { font-size: var(--fs-sm); color: var(--navy-800); }
.tk-brand-text span { font-size: var(--fs-xs); color: var(--green-700); font-weight: 600; }
.tk-back {
  display: inline-flex; align-items: center; min-height: 40px; padding: var(--s1) var(--s3);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); text-decoration: none;
  font-size: var(--fs-sm); font-weight: 600; color: var(--navy-800); background: var(--surface);
}
.tk-back:hover { border-color: var(--navy-500); }
.tk-head-links { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.tk-nav { display: flex; gap: var(--s2); flex-wrap: wrap; }
.tk-navlink {
  display: inline-flex; align-items: center; min-height: 40px; padding: var(--s1) var(--s3);
  border-radius: var(--r-sm); text-decoration: none; font-size: var(--fs-sm); font-weight: 600; color: var(--navy-500);
}
.tk-navlink:hover, .tk-navlink:focus-visible { text-decoration: underline; }

/* ---------- page */
.tk-banner:empty { display: none; }
.tk-banner { max-width: var(--page-w); margin: var(--s4) auto 0; padding: 0 var(--s4); }
.tk-view {
  max-width: var(--page-w); margin: 0 auto; padding: var(--s5) var(--s4) var(--s8);
  display: flex; flex-direction: column; gap: var(--s4);
}
.tk-view:focus { outline: none; }
.tk-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--e1); padding: var(--s4); }
.tk-card-dashed { border-style: dashed; box-shadow: none; }
.tk-gate { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--s3); padding: var(--s7) var(--s4); }
.tk-gate h1 { margin: 0; }
.tk-gate p { margin: 0; color: var(--muted); max-width: 36rem; }
.tk-actions { display: flex; gap: var(--s2); flex-wrap: wrap; align-items: center; }
.tk-loading { display: flex; align-items: center; gap: var(--s3); color: var(--muted); padding: var(--s6) 0; }
.tk-spin {
  width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--navy-500);
  animation: tk-spin 0.8s linear infinite;
}
@keyframes tk-spin { to { transform: rotate(360deg); } }

/* ---------- notes and banners (icon-free; the sentence is the signal) */
.tk-note { border-radius: var(--r-sm); padding: var(--s3) var(--s4); border-left: 4px solid var(--info); background: var(--info-bg); color: var(--info-ink); }
.tk-note-good { border-color: var(--good); background: var(--good-bg); color: var(--good-ink); }
.tk-note-warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn-ink); }
.tk-note-crit { border-color: var(--crit); background: var(--crit-bg); color: var(--crit-ink); }
.tk-note p:last-child { margin-bottom: 0; }

/* ---------- status pill (always has text) */
.tk-pill {
  display: inline-flex; align-items: center; gap: var(--s1); border-radius: var(--r-pill);
  padding: 2px var(--s3); font-size: var(--fs-xs); font-weight: 600; white-space: nowrap;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
}
.tk-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.tk-pill-info { background: var(--info-bg); color: var(--info-ink); border-color: transparent; }
.tk-pill-good { background: var(--good-bg); color: var(--good-ink); border-color: transparent; }
.tk-pill-warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
.tk-pill-crit { background: var(--crit-bg); color: var(--crit-ink); border-color: transparent; }
.tk-pills { display: flex; gap: var(--s2); flex-wrap: wrap; }

/* ---------- buttons and forms (40px touch targets) */
.tk-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: 44px;
  padding: var(--s2) var(--s4); border-radius: var(--r-sm); border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--navy-800); font-weight: 600; text-decoration: none; cursor: pointer;
  transition: background var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.tk-btn:hover { border-color: var(--navy-500); }
.tk-btn:disabled, .tk-btn[aria-disabled="true"] { opacity: 0.55; cursor: not-allowed; }
.tk-btn-primary { background: var(--navy-500); border-color: var(--navy-500); color: var(--on-dark); }
.tk-btn-primary:hover { background: var(--navy-800); border-color: var(--navy-800); }
.tk-btn-good { background: var(--green-700); border-color: var(--green-700); color: var(--on-dark); }
.tk-btn-danger { background: var(--surface); border-color: var(--crit); color: var(--crit-ink); }
.tk-btn-small { min-height: 36px; padding: var(--s1) var(--s3); font-size: var(--fs-sm); }
.tk-btn-block { width: 100%; }
.tk-form { display: grid; gap: var(--s4); grid-template-columns: 1fr; }
.tk-field { display: flex; flex-direction: column; gap: var(--s1); min-width: 0; }
.tk-field label { font-size: var(--fs-sm); font-weight: 600; color: var(--navy-800); }
.tk-field input, .tk-field select, .tk-field textarea {
  border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: var(--s2) var(--s3);
  min-height: 44px; background: var(--surface); width: 100%; font-size: 16px;  /* 16px: no zoom on iOS focus */
}
.tk-field textarea { min-height: 88px; }
.tk-field input:disabled, .tk-field select:disabled { background: var(--surface-2); color: var(--muted); }
.tk-field .tk-hint { font-size: var(--fs-xs); color: var(--muted); }
.tk-field .tk-err { font-size: var(--fs-xs); color: var(--crit-ink); }
.tk-field input[aria-invalid="true"], .tk-field select[aria-invalid="true"] { border-color: var(--crit); }
.tk-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }   /* honeypot field */
.tk-check { display: flex; align-items: center; gap: var(--s2); min-height: 44px; font-size: var(--fs-sm); }

/* ---------- tables: a grid on wide screens, a stack of labelled cards on phones */
.tk-table-wrap { overflow-x: auto; }
table.tk-grid { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
table.tk-grid th, table.tk-grid td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.tk-grid th { background: var(--surface-2); color: var(--navy-800); font-weight: 600; }
table.tk-stack thead { display: none; }
table.tk-stack, table.tk-stack tbody, table.tk-stack tr, table.tk-stack td { display: block; width: 100%; }
table.tk-stack tr { border: 1px solid var(--line); border-radius: var(--r-md); margin-bottom: var(--s3); padding: var(--s2) var(--s3); background: var(--surface); }
table.tk-stack td { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s3); border: 0; padding: var(--s1) 0; text-align: right; overflow-wrap: anywhere; }
table.tk-stack td::before { content: attr(data-label); color: var(--muted); font-size: var(--fs-xs); text-align: left; flex: none; padding-top: 2px; }
table.tk-stack td:empty { display: none; }

/* ---------- key / value list */
.tk-kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--s1) var(--s4); margin: 0 0 var(--s3); font-size: var(--fs-sm); }
.tk-kv dt { color: var(--muted); }
.tk-kv dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- QR code */
.tk-qr { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto; background: var(--surface); }

/* ---------- modal and toast */
#tk-overlay:empty { display: none; }
.tk-backdrop { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
.tk-modal {
  position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(520px, calc(100vw - 2 * var(--s4))); max-height: calc(100vh - 2 * var(--s6)); overflow: auto;
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--e3); padding: var(--s5);
}
.tk-modal:focus { outline: none; }
.tk-modal-actions { display: flex; gap: var(--s2); flex-wrap: wrap; justify-content: flex-end; margin: var(--s4) 0 var(--s2); }
.tk-toast-slot { position: fixed; left: var(--s4); right: var(--s4); bottom: var(--s4); z-index: 50; display: flex; justify-content: center; pointer-events: none; }
.tk-toast { background: var(--navy-900); color: var(--on-dark); border-radius: var(--r-md); box-shadow: var(--e3); padding: var(--s3) var(--s4); max-width: 420px; font-size: var(--fs-sm); pointer-events: auto; }
.tk-toast-good { border-left: 4px solid var(--green-400); }
.tk-toast-crit { border-left: 4px solid var(--crit); }
.tk-toast-warn { border-left: 4px solid var(--warn); }

/* ---------- register page: event cards, form, receipt */
.tk-ev h2 { overflow-wrap: anywhere; }
.tk-ev .tk-kv { grid-template-columns: max-content minmax(0, 1fr); }
.tk-hl { border-color: var(--navy-500); box-shadow: 0 0 0 3px var(--info-bg), var(--e2); }
.tk-fee { display: inline-block; font-weight: 600; color: var(--navy-800); margin-right: var(--s3); }
.tk-slot { margin-top: var(--s3); display: grid; gap: var(--s3); }
.tk-slot:empty { display: none; }
.tk-regform .tk-note { margin: 0; }
.tk-pay { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: var(--s3) var(--s4); }
.tk-pay p { margin: 0 0 var(--s2); }
.tk-pay p:last-child { margin-bottom: 0; }
.tk-paynote { white-space: pre-line; overflow-wrap: anywhere; }
.tk-done { display: grid; gap: var(--s2); }
.tk-done h3 { font-size: var(--fs-lg); margin: 0; }
.tk-done p { margin: 0; }
.tk-done:focus { outline: none; }
.tk-done input[readonly] { font-size: var(--fs-sm); }
.tk-ev .tk-actions .tk-btn, .tk-done .tk-actions .tk-btn { flex: 1 1 auto; }

/* ---------- ticket page: the ticket, My tickets list */
.tk-ticket { display: grid; gap: var(--s3); max-width: 520px; margin: 0 auto; width: 100%; }
.tk-ticket > * { margin: 0; min-width: 0; }
.tk-ticket-brand { display: none; align-items: center; gap: var(--s3); }
.tk-ticket-brand .tk-brand-text { display: grid; line-height: 1.25; }
.tk-ticket-brand .tk-brand-text span { color: var(--muted); font-size: var(--fs-sm); }
.tk-ticket-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.tk-ticket-top h1 { margin: 0; }
.tk-tkbanner h2 { margin: 0 0 var(--s1); font-size: var(--fs-lg); color: inherit; }
.tk-tkbanner p { white-space: pre-line; overflow-wrap: anywhere; }
.tk-qrbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--s3); }
.tk-ticket-note { text-align: center; color: var(--muted); font-size: var(--fs-sm); }
.tk-ticket-no { font-size: var(--fs-lg); text-align: center; }
.tk-ticket .tk-kv { grid-template-columns: max-content minmax(0, 1fr); }
.tk-ticket .tk-actions .tk-btn { flex: 1 1 auto; text-align: center; }
.tk-tlist { display: grid; gap: var(--s3); }
.tk-tcard { display: block; text-decoration: none; color: inherit; overflow-wrap: anywhere; }
a.tk-tcard:hover { border-color: var(--navy-500); }
.tk-tcard h2 { margin: 0 0 var(--s1); }
.tk-tcard p { margin: 0 0 var(--s2); }
.tk-tcard-row { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }
.tk-tcard-go { color: var(--navy-500); font-weight: 600; font-size: var(--fs-sm); }

/* ---------- check-in page: picker, count, camera, big result card */
.tk-ck { display: grid; gap: var(--s4); }
.tk-ck h1 { margin: 0; }
.tk-ck-pick select { font-size: 16px; }
.tk-ck-top { display: grid; gap: var(--s3); }
.tk-ck-top:empty { display: none; }
.tk-ck-evline { display: grid; gap: var(--s1); overflow-wrap: anywhere; }
.tk-ck-evline b { color: var(--navy-800); font-size: var(--fs-lg); }
.tk-ck-count { margin: 0; font-size: var(--fs-lg); color: var(--navy-800); font-variant-numeric: tabular-nums; }
.tk-ck-count b { font-size: var(--fs-xl); }
.tk-ck-main { display: grid; gap: var(--s4); }
.tk-ck-scan { display: grid; gap: var(--s4); }
.tk-ck-cam[hidden], .tk-ck-camctl [hidden] { display: none; }
.tk-ck-cam { display: grid; gap: var(--s2); }
.tk-ck-video { width: 100%; max-height: 60vh; aspect-ratio: 4 / 3; object-fit: cover; background: var(--navy-900); border-radius: var(--r-md); }
.tk-ck-camtip { margin: 0; text-align: center; }
.tk-ck-camctl { display: grid; gap: var(--s2); }
.tk-ck-btn { min-height: 56px; font-size: var(--fs-lg); }
.tk-ck-manual .tk-field input { min-height: 52px; letter-spacing: 0.02em; }
.tk-res { display: grid; gap: var(--s3); border-width: 2px; border-left-width: 10px; scroll-margin-top: var(--s4); }
.tk-res:focus { outline: none; }
.tk-res-good { border-color: var(--good); background: var(--good-bg); color: var(--good-ink); }
.tk-res-warn { border-color: var(--warn); background: var(--warn-bg); color: var(--warn-ink); }
.tk-res-info { border-color: var(--info); background: var(--info-bg); color: var(--info-ink); }
.tk-res-crit { border-color: var(--crit); background: var(--crit-bg); color: var(--crit-ink); }
.tk-res-head { display: flex; align-items: center; gap: var(--s3); }
.tk-res-sym {
  flex: none; width: 48px; height: 48px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
  background: currentColor; font-size: var(--fs-2xl); font-weight: 700; line-height: 1;
}
.tk-res-sym { -webkit-text-fill-color: var(--surface); }
.tk-res-title { margin: 0; font-size: var(--fs-2xl); line-height: 1.15; color: inherit; overflow-wrap: anywhere; }
.tk-ck-advice { margin: 0; font-size: var(--fs-md); font-weight: 600; }
.tk-res .tk-kv { margin: 0; font-size: var(--fs-md); }
.tk-res .tk-kv dt { color: inherit; opacity: 0.8; }
.tk-ck-name { font-weight: 700; font-size: var(--fs-lg); }
.tk-ck-change { margin: 0; overflow-wrap: anywhere; white-space: pre-line; }
.tk-ck-actions { display: grid; gap: var(--s2); }

/* ---------- events console (manage.html): overview cards, tabs, lists */
.tk-mg { display: grid; gap: var(--s4); grid-template-columns: minmax(0, 1fr); min-width: 0; }
.tk-mg > * { min-width: 0; }
.tk-mg h1 { margin: 0; overflow-wrap: anywhere; }
.tk-mg-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.tk-mg-evs { display: grid; gap: var(--s4); }
.tk-mg-ev h2 { margin: 0; overflow-wrap: anywhere; }
.tk-mg-evhead, .tk-mg-evline { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.tk-mg-evline { justify-content: flex-start; }
.tk-mg-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2) var(--s4); margin: var(--s3) 0; }
.tk-mg-stat { display: flex; flex-direction: column-reverse; border-top: 1px solid var(--line); padding-top: var(--s2); }
.tk-mg-stat dt { font-size: var(--fs-xs); color: var(--muted); }
.tk-mg-stat dd { margin: 0; font-weight: 700; font-size: var(--fs-md); color: var(--navy-800); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tk-mg-ev .tk-note { margin: 0 0 var(--s2); }
.tk-mg-refunds { margin: var(--s2) 0 0; padding-left: var(--s5); }
.tk-mg-notice:empty { display: none; }
.tk-mg-notice .tk-note p { margin: 0 0 var(--s1); overflow-wrap: anywhere; }

      lines.forEach(function (l) { y += lineH(size); doc.text(String(l), x === undefined ? M : x, y); });
    }
    function box(bg, fg, title, body) {
      var lines = body ? clamp(wrap(pdfText(body, 200), 9, inner - 8), 3) : [];
      var h = 6 + 5 + lines.length * lineH(9) + 3;
      color('setFillColor', bg); doc.rect(M, y, inner, h, 'F');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); color('setTextColor', fg); doc.text(pdfText(title), M + 4, y + 7);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
      lines.forEach(function (l, i) { doc.text(String(l), M + 4, y + 7 + 5 + i * lineH(9) - 1); });
      y += h + 4;
    }

    // header: logo + organisation
    var s = 14 / 200;
    TK.MARK.forEach(function (m) {
      var pts = m[1].split(' ').map(function (p) { var q = p.split(','); return [Number(q[0]), Number(q[1])]; });
      var vecs = [];
      for (var i = 1; i < pts.length; i++) vecs.push([pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]]);
      color('setFillColor', hexRgb(m[0]));
      doc.lines(vecs, M + pts[0][0] * s, y + pts[0][1] * s, [s, s], 'F', true);
    });
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); color('setTextColor', RGB.navy);
    var orgLines = clamp(wrap(pdfText(TK.ORG), 9.5, inner - 20, true), 2);
    orgLines.forEach(function (l, i) { doc.text(String(l), M + 18, y + 5 + i * lineH(9.5)); });
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); color('setTextColor', RGB.muted);
    doc.text(pdfText(TK.CHAPTER), M + 18, y + 5 + orgLines.length * lineH(9.5));
    y += 18;
    color('setDrawColor', RGB.line); doc.line(M, y, W - M, y);
    y += 2;

    para('Event ticket', 16, true, RGB.navy);
    y += 1;
    para('Status: ' + statusOf(ticket)[1], 11, true, RGB.text);
    y += 3;

    if (cancelled) box(RGB.critBg, RGB.critInk, 'Event cancelled', e.change_note);
    else {
      if (changed) box(RGB.warnBg, RGB.warnInk, 'Event update', e.change_note);
      if (dead) box(RGB.critBg, RGB.critInk, statusOf(ticket)[1], ticket.payment_status === 'refund_due'
        ? 'A refund is due. This ticket cannot be used for entry.' : 'This ticket is cancelled and cannot be used for entry.');
    }

    para(e.title, 13, true, RGB.navy, M, inner, 2);
    para(TK.when(e.event_date), 10, false, RGB.text);
    if (e.venue) para(e.venue, 10, false, RGB.text, M, inner, 2);
    y += 3;
    para('Ticket number', 8.5, false, RGB.muted);
    para(ticket.ticket_no, 15, true, RGB.text);
    y += 1;
    para('Ticket holder: ' + ticket.holder_name, 10, false, RGB.text, M, inner, 2);
    para((ticket.kind === 'member' ? 'Member' : 'Guest') + ' ticket · Fee: ' + money(ticket.fee_sar), 10, false, RGB.text);
    if (ticket.checked_in_at) para('Checked in: ' + TK.when(ticket.checked_in_at), 10, false, RGB.text);
    y += 3;

    if (!dead) {
      var lib = opts.qrcode || root.qrcode;
      if (typeof lib !== 'function') throw TK.makeError('LIB_MISSING');
      var q = lib(0, 'M'); q.addData(String(opts.token)); q.make();
      var n = q.getModuleCount(), Q = 4;
      var room = PAGE.h - M - 12 - y;
      var size = Math.max(40, Math.min(64, room));
      var mod = size / (n + 2 * Q), x0 = (W - size) / 2;
      color('setFillColor', RGB.white); doc.rect(x0, y, size, size, 'F');
      color('setFillColor', RGB.black);
      for (var r = 0; r < n; r++) {
        var c = 0;
        while (c < n) {
          if (!q.isDark(r, c)) { c++; continue; }
          var start = c;
          while (c < n && q.isDark(r, c)) c++;
          doc.rect(x0 + (start + Q) * mod, y + (r + Q) * mod, (c - start) * mod, mod, 'F');
        }
      }
      y += size + 2;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); color('setTextColor', RGB.muted);
      doc.text(pdfText('Show this QR code at the registration desk. The officer\'s scan shows the live status.'), W / 2, y + 3, { align: 'center' });
    }
    return doc;
  }

  // ------------------------------------------------------------------ actions
  TK.action('tkt.pdf', function () {
    if (!S.cur) return null;
    var lib = root.jspdf && root.jspdf.jsPDF;
    if (!lib) { TK.toast(TK.ERRORS.LIB_MISSING(), 'crit'); return null; }
    try {
      var doc = buildPdf(S.cur.ticket, { token: S.cur.token, JsPDF: lib, qrcode: root.qrcode });
      doc.save('ticket-' + String(S.cur.ticket.ticket_no || 'ticket').replace(/[^A-Za-z0-9._-]/g, '_') + '.pdf');
    } catch (e) { TK.toast(TK.friendlyError(e), 'crit'); }
    return null;
  });
  TK.action('tkt.print', function () {
    if (root.print) root.print();
    return null;
  });

  // ------------------------------------------------------------------ page
  function rawHash() { var h = root.location && root.location.hash; return typeof h === 'string' ? h.replace(/^#/, '') : ''; }

  TK.registerPage({
    id: 'ticket',
    title: 'Your ticket',
    access: 'public',
    render: function (ctx) {
      var session = ctx.session || null;
      // S.cur (the ticket Download PDF uses) is set only in mount(), which the shell calls for the current render only
      function plain(html) { return { html: html, mount: function () { S.cur = null; } }; }
      if (ctx.token) {
        var token = ctx.token;
        return TK.rpc('ticketing_get_ticket', { p_token: token }).then(function (t) {
          if (!t || typeof t !== 'object' || !t.ticket_no) return plain(invalidHtml());
          return { html: ticketHtml(t, token, session), mount: function () { S.cur = { ticket: t, token: token }; } };
        }, function (err) {
          if (err && err.code === 'TKT_NOT_FOUND') return plain(invalidHtml());
          throw err;
        });
      }
      if (rawHash() !== '') return plain(invalidHtml());
      if (!session) return plain(signedOutHtml());
      return TK.rpc('ticketing_my_tickets').then(function (list) {
        return plain(listHtml(session, Array.isArray(list) ? list : []));
      });
    }
  });

  TK.ticketPage = { buildPdf: buildPdf, pdfText: pdfText, statusOf: statusOf };
}(typeof window !== 'undefined' ? window : globalThis));
</script>
<script>TK.start();</script>
</body>
